  <main>
    <div class="page-head container"><a class="back" href="index.html">&larr; All tools</a><h1>Add Page Numbers</h1><p>Number every page in your PDF. Choose where the number appears, its size, and the starting number.</p></div>
    <div class="container organizer-container">
      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Choose a PDF or drop it here"><h3>Select a PDF</h3><p>or drag &amp; drop it here</p><button class="btn btn-primary" type="button" onclick="event.stopPropagation(); fileInput.click()">Choose PDF</button><input id="fileInput" type="file" accept="application/pdf,.pdf" hidden /></div>
      <div id="fileStrip"></div>
      <div class="number-options" id="numberOptions" hidden>
        <label>Start numbering at<input class="name-input" id="startNumber" type="number" min="1" max="999999" value="1" /></label>
        <label>Number size<select class="name-input" id="numberSize"><option value="9">Small</option><option value="11" selected>Medium</option><option value="14">Large</option></select></label>
        <label>Position<select class="name-input" id="numberPosition"><option value="bottom" selected>Bottom center</option><option value="top">Top center</option></select></label>
        <button class="btn btn-done" id="numberBtn" type="button">Add page numbers</button>
      </div>
      <div class="result-bar" id="resultBar" hidden><span class="result-text">Your numbered PDF is ready.</span><div class="name-row"><input class="name-input" id="fileName" type="text" placeholder="numbered" aria-label="Output file name" maxlength="80" /><span class="name-ext">.pdf</span></div><button class="btn btn-ghost" id="newJobBtn" type="button">Start another</button><button class="btn btn-primary result-download" id="downloadBtn" type="button">&#8595; Download PDF</button></div>
      <p class="status" id="status" role="status"></p>
    </div>
